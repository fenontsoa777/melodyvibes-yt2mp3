<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelodyVibes - YouTube to MP3 Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff4757',
                        dark: '#2f3542',
                        accent: '#2ed573',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

    <nav class="bg-dark text-white py-4 px-6 md:px-20 flex flex-col md:flex-row justify-between items-center shadow-lg gap-4">
        <div class="flex items-center gap-3 cursor-pointer group">
            <svg class="text-primary transition-transform group-hover:-rotate-12" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 17V5L19 3V15"/>
                <path d="M9 17C9 18.6569 7.65685 20 6 20C4.34315 20 3 18.6569 3 17C3 15.3431 4.34315 14 6 14C7.65685 14 9 15.3431 9 17Z" fill="currentColor"/>
                <path d="M19 15C19 16.6569 17.6569 18 16 18C14.3431 18 13 16.6569 13 15C13 13.3431 14.3431 12 16 12C17.6569 12 19 13.3431 19 15Z" fill="currentColor"/>
            </svg>
            <span class="text-2xl font-extrabold tracking-tight">Melody<span class="text-primary">Vibes</span></span>
        </div>
        <ul class="flex gap-6 text-sm font-medium opacity-80">
            <li class="hover:text-primary cursor-pointer transition">Converter</li>
            <li class="hover:text-primary cursor-pointer transition">Playlists</li>
            <li class="hover:text-primary cursor-pointer transition">FAQ</li>
        </ul>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-12 md:py-20 text-center">
        <h1 class="text-4xl md:text-6xl font-black text-dark mb-4 leading-tight">
            YouTube to <span class="text-primary">MP3</span>
        </h1>
        <p class="text-gray-500 mb-10 max-w-lg mx-auto text-lg">
            Convertissez instantanément vos vidéos YouTube préférées en fichiers audio de haute qualité.
        </p>

        <div class="max-w-2xl mx-auto mb-12">
            <div class="flex flex-col md:flex-row bg-white rounded-2xl md:rounded-full p-2 shadow-2xl border border-gray-100 gap-2">
                <input type="text" id="searchInput" placeholder="Collez un lien YouTube..." 
                       class="flex-grow px-6 py-4 bg-transparent outline-none text-lg rounded-full">
                <button id="searchBtn" class="bg-primary hover:bg-red-600 text-white font-bold py-4 px-10 rounded-xl md:rounded-full transition-all transform active:scale-95 shadow-lg">
                    Convertir
                </button>
            </div>
        </div>

        <div id="loader" class="hidden mx-auto w-12 h-12 border-4 border-gray-200 border-t-primary rounded-full animate-spin mb-8"></div>

        <div id="results" class="max-w-2xl mx-auto space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col md:flex-row items-center justify-between gap-4 border border-gray-100 border-l-4 border-l-primary">
                <div class="flex items-center gap-4 w-full text-left">
                    <div class="w-24 h-16 bg-gray-200 rounded-lg flex-shrink-0"></div>
                    <div>
                        <h3 class="font-bold text-dark line-clamp-1">Titre de la vidéo exemple</h3>
                        <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Qualité HD • 3:45</p>
                    </div>
                </div>
                <button class="bg-accent hover:bg-green-600 text-white font-bold py-2 px-6 rounded-xl w-full md:w-auto transition-colors">
                    Download
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white py-10 px-4 text-center border-t border-gray-200">
        <div class="container mx-auto">
            <p class="text-gray-400 text-sm mb-4 font-medium italic">"La musique donne une âme à nos cœurs."</p>
            <p class="text-gray-600 text-sm font-bold">&copy; 2026 MelodyVibes Project.</p>
            <div class="flex justify-center gap-6 mt-4 text-xs font-bold text-gray-400 uppercase tracking-tighter">
                <a href="#" class="hover:text-primary transition">Terms</a>
                <a href="#" class="hover:text-primary transition">Privacy</a>
                <a href="#" class="hover:text-primary transition">Contact</a>
            </div>
        </div>
    </footer>

    <script>
    // Configuration des clés
    const YT_API_KEY = 'AIzaSyC7FC7DH68fP_PrpCKOQTJqrVIvMPaEk8s';
    
    // Éléments du DOM
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    const resultsDiv = document.getElementById('results');
    const loader = document.getElementById('loader');

    // 1. Fonction pour extraire l'ID de la vidéo depuis une URL ou une recherche
    function extractVideoId(input) {
        const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
        const match = input.match(regex);
        return (match && match[1]) ? match[1] : null;
    }

    // 2. Fonction pour afficher la vidéo et le bouton de téléchargement
    async function displayVideoInfo(videoId) {
        resultsDiv.innerHTML = "";
        loader.classList.remove('hidden');

        try {
            // Appel à l'API YouTube Data v3 pour avoir les détails (titre, miniature)
            const response = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails&id=${videoId}&key=${YT_API_KEY}`);
            const data = await response.json();

            loader.classList.add('hidden');

            if (data.items && data.items.length > 0) {
                const video = data.items[0];
                const title = video.snippet.title;
                const thumb = video.snippet.thumbnails.medium.url;

                // Création de l'interface de résultat
                resultsDiv.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl border-l-4 border-primary animate-bounce-short">
                        <div class="flex flex-col md:flex-row items-center gap-6">
                            <img src="${thumb}" class="w-full md:w-48 rounded-xl shadow-md" alt="Miniature">
                            <div class="flex-grow text-left">
                                <h3 class="font-bold text-xl text-dark mb-2">${title}</h3>
                                <p class="text-gray-400 text-sm mb-4 italic">Prêt pour la conversion MP3</p>
                                
                                <button onclick="startDownload('${videoId}')" 
                                        class="w-full md:w-auto bg-accent hover:bg-green-600 text-white font-black py-3 px-8 rounded-xl transition-all transform hover:scale-105 shadow-lg flex items-center justify-center gap-2">
                                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 16l-5-5h3V4h4v7h3l-5 5zm9 2v2H3v-2h18z"/></svg>
                                    TÉLÉCHARGER EN MP3
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                alert("Vidéo introuvable. Vérifiez le lien.");
            }
        } catch (error) {
            console.error("Erreur YouTube API:", error);
            loader.classList.add('hidden');
        }
    }

    // 3. Gestionnaire du clic sur "Convertir"
    searchBtn.addEventListener('click', () => {
        const input = searchInput.value.trim();
        if (!input) return;

        const videoId = extractVideoId(input);

        if (videoId) {
            // Si c'est un lien direct, on affiche les infos
            displayVideoInfo(videoId);
        } else {
            // Si ce n'est pas un lien, on pourrait lancer une recherche (on verra ça après si tu veux)
            alert("Veuillez coller un lien YouTube valide pour le moment.");
        }
    });

    // Optionnel: Touche Entrée pour valider
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchBtn.click();
    });

    // Fonction Placeholder pour le téléchargement (prochaine étape)
    function startDownload(id) {
        console.log("Lancement du téléchargement pour l'ID:", id);
        // Ici on appellera RapidAPI
    }
</script>

</body>
</html>
